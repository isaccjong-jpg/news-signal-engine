name: news-signal-engine

on:
  # 정시 실행은 cron-job.org가 workflow_dispatch로 호출(매시 7분 KST, mode=auto → 18시 실행분에서 측정·요약).
  # GitHub 자체 schedule은 수십 분~수 시간 지연돼 제거(FOOD CALL ENGINE과 동일 방식).
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | collect | measure"
        default: "auto"

concurrency:
  group: news-signal-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          PRIVATE_PROMPT: ${{ secrets.PRIVATE_PROMPT }}
          PRIVATE_UNIVERSE: ${{ secrets.PRIVATE_UNIVERSE }}
          # 환경변수는 CONFIG_JSON보다 우선(config.py). 2026-10-21 Sonnet 그림자 제거(비용 월 $100→$67). 복원하려면 이 줄 삭제.
          LLM_PROVIDERS: "anthropic:claude-opus-5-5"
          TZ: Asia/Seoul
        run: python main.py ${{ github.event.inputs.mode || 'auto' }}
